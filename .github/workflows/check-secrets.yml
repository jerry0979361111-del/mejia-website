name: 檢查金鑰設定（臨時）

# 只在推送到 claude/check-secrets 分支時執行；只顯示是否設定與能否連線，不會印出金鑰內容。
on:
  push:
    branches: [claude/check-secrets]

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 檢查是否設定
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          for k in OPENAI_API_KEY ANTHROPIC_API_KEY CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID NOTION_TOKEN; do
            if [ -n "${!k}" ]; then echo "$k: 已設定（長度 ${#k}）" | sed "s/（長度 .*）//"; else echo "$k: 未設定"; fi
          done
      - name: 測試 OpenAI 金鑰
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          [ -z "$OPENAI_API_KEY" ] && { echo "略過（未設定）"; exit 0; }
          code=$(curl -s -o /tmp/models.json -w '%{http_code}' https://api.openai.com/v1/models -H "Authorization: Bearer $OPENAI_API_KEY")
          echo "OpenAI 回應碼：$code"
          python3 -c "import json;d=json.load(open('/tmp/models.json'));ids=sorted(m['id'] for m in d.get('data',[]));print('可用模型含 gpt-5.5：', 'gpt-5.5' in ids);print('gpt 系列：', [i for i in ids if i.startswith(('gpt-5','gpt-6'))][:40])" || true
      - name: 測試 Notion 金鑰
        env:
          NOTION_TOKEN: ${{ secrets.NOTION_TOKEN }}
        run: |
          [ -z "$NOTION_TOKEN" ] && { echo "略過（未設定）"; exit 0; }
          code=$(curl -s -o /dev/null -w '%{http_code}' https://api.notion.com/v1/databases/13280ab9d400417ba12125a3d9c2d0d7 -H "Authorization: Bearer $NOTION_TOKEN" -H "Notion-Version: 2022-06-28")
          echo "Notion 讀取建案資料庫回應碼：$code（200＝可讀取；404＝integration 沒有連到資料庫）"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: 測試 Cloudflare 金鑰
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          [ -z "$CLOUDFLARE_API_TOKEN" ] && { echo "略過（未設定）"; exit 0; }
          npx -y wrangler@4 whoami 2>&1 | grep -v -i "token\b" | tail -15
          npx -y wrangler@4 deployments list --name mejia-website 2>&1 | tail -4
